<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#6b1424" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#1e1e23" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#101013"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf8f"/>
      <stop offset="48%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a6823"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221116"/>
      <stop offset="100%" stop-color="#12090c"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="640" height="420" rx="12" fill="url(#bgGlow)"/>
  <rect x="14" y="14" width="612" height="392" rx="8" stroke="#c9a24b" stroke-opacity="0.4" stroke-width="1.2"/>
  <rect x="22" y="22" width="596" height="376" rx="6" stroke="#c9a24b" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Corner ornaments -->
  <path d="M26 52 L26 26 L52 26 M614 52 L614 26 L588 26 M26 368 L26 394 L52 394 M614 368 L614 394 L588 394" stroke="#c9a24b" stroke-width="2" stroke-linecap="round"/>

  <!-- Guilloche geometric halo -->
  <circle cx="320" cy="210" r="158" stroke="#c9a24b" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="320" cy="210" r="142" stroke="#c9a24b" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M320 36 L334 62 L320 54 L306 62 Z" fill="#c9a24b" fill-opacity="0.65"/>
  <path d="M320 384 L334 358 L320 366 L306 358 Z" fill="#c9a24b" fill-opacity="0.65"/>

  <!-- Watch strap / lugs -->
  <path d="M276 46 H364 L354 102 H286 Z" fill="#17171c" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M286 318 H354 L364 374 H276 Z" fill="#17171c" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <line x1="292" y1="68" x2="348" y2="68" stroke="#c9a24b" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="292" y1="352" x2="348" y2="352" stroke="#c9a24b" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Crown & chronograph pushers -->
  <rect x="442" y="196" width="16" height="28" rx="3" fill="url(#goldGrad)"/>
  <rect x="430" y="138" width="14" height="18" rx="3" transform="rotate(24 430 138)" fill="url(#goldGrad)"/>
  <rect x="436" y="264" width="14" height="18" rx="3" transform="rotate(-24 436 264)" fill="url(#goldGrad)"/>

  <!-- Outer Gold Bezel -->
  <circle cx="320" cy="210" r="124" fill="url(#goldGrad)"/>
  <circle cx="320" cy="210" r="115" fill="#16161a" stroke="#e8cf8f" stroke-width="1.5"/>
  <circle cx="320" cy="210" r="108" fill="url(#dialGrad)" stroke="#c9a24b" stroke-width="2"/>

  <!-- Subdials -->
  <circle cx="272" cy="210" r="24" fill="#140b0e" stroke="#c9a24b" stroke-opacity="0.65" stroke-width="1.2"/>
  <line x1="272" y1="210" x2="272" y2="193" stroke="#e8cf8f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="368" cy="210" r="24" fill="#140b0e" stroke="#c9a24b" stroke-opacity="0.65" stroke-width="1.2"/>
  <line x1="368" y1="210" x2="381" y2="218" stroke="#e8cf8f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="320" cy="256" r="22" fill="#140b0e" stroke="#c9a24b" stroke-opacity="0.65" stroke-width="1.2"/>
  <line x1="320" y1="256" x2="310" y2="244" stroke="#e8cf8f" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Hour Indices -->
  <g stroke="#e8cf8f" stroke-linecap="round">
    <line x1="320" y1="110" x2="320" y2="124" stroke-width="3.2"/>
    <line x1="320" y1="296" x2="320" y2="310" stroke-width="3.2"/>
    <line x1="220" y1="210" x2="234" y2="210" stroke-width="3.2"/>
    <line x1="406" y1="210" x2="420" y2="210" stroke-width="3.2"/>
    <line x1="370" y1="123" x2="364" y2="134" stroke-width="2"/>
    <line x1="407" y1="160" x2="396" y2="166" stroke-width="2"/>
    <line x1="407" y1="260" x2="396" y2="254" stroke-width="2"/>
    <line x1="370" y1="297" x2="364" y2="286" stroke-width="2"/>
    <line x1="270" y1="297" x2="276" y2="286" stroke-width="2"/>
    <line x1="233" y1="260" x2="244" y2="254" stroke-width="2"/>
    <line x1="233" y1="160" x2="244" y2="166" stroke-width="2"/>
    <line x1="270" y1="123" x2="276" y2="134" stroke-width="2"/>
  </g>

  <!-- House Diamond Crest at 12 o'clock -->
  <path d="M320 134 L330 146 L320 158 L310 146 Z" fill="#6b1424" stroke="#e8cf8f" stroke-width="1.5"/>

  <!-- Watch Hands (10:10) -->
  <line x1="320" y1="210" x2="274" y2="176" stroke="#e8cf8f" stroke-width="5" stroke-linecap="round"/>
  <line x1="320" y1="210" x2="378" y2="164" stroke="#f2ebdd" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="305" y1="228" x2="352" y2="144" stroke="#c9a24b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="320" cy="210" r="6" fill="#e8cf8f" stroke="#6b1424" stroke-width="2"/>
</svg>

